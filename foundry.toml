# Pinned toolchain. Every value here is serialized into each receipt —
# if it changes, previously recorded gas numbers stop being comparable.
# Values mirror OpenZeppelin's own foundry.toml so our gas figures match theirs.

[profile.default]
src = 'contracts/src'
test = 'contracts/test'
out = 'out'
libs = ['lib']

solc_version = '0.8.35'
evm_version = 'osaka'      # ✅ day 1: hevm 0.58.0 consumed osaka-compiled bytecode and
                           #    proved log256/log2 equivalent. ⚠️ That establishes it handles
                           #    what OUR targets compile to -- NOT that it supports every
                           #    osaka opcode. Re-check if a target starts emitting new ones;
                           #    fall back to 'cancun' and DECLARE the divergence from OZ's config.
optimizer = true
optimizer_runs = 200
# Must match the solc flags in harness/src/compile.mjs. Metadata carries an IPFS
# hash of the SOURCE TEXT, so identical logic in differently-formatted files
# compiles to different bytecode -- which would defeat third-party recomputation.
bytecode_hash = 'none'
# The harness compiles model patches into .run/ and PatchGas.t.sol reads the
# runtime bytecode from there. Least privilege: one project-local directory,
# never /tmp, which would grant every test read access to the whole machine.
fs_permissions = [{ access = 'read', path = './.run' }]

# Gate 2 — differential fuzzing.
#
# ⚠️ Pinned, because FUZZED means nothing without the campaign that produced it:
# §7 requires "campaigns, seeds, corpus, ranges, and what was compared". A fixed
# seed also makes any divergence reproducible by a third party rather than a
# story about something we once saw.
#
# ⚠️ These values ARE the label. Changing runs or seed changes what FUZZED
# asserts, so they are serialized into every receipt alongside it.
[profile.default.fuzz]
runs = 20000
seed = '0x7768657473746f6e65'   # "whetstone" — pinned, recorded in the receipt
max_test_rejects = 100000

[profile.ci]
fuzz = { runs = 100_000 }
